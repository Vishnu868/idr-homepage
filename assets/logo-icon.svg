<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="face-left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8650A"/>
      <stop offset="100%" stop-color="#C45000"/>
    </linearGradient>
    <linearGradient id="face-right" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8C33"/>
      <stop offset="100%" stop-color="#E8650A"/>
    </linearGradient>
    <linearGradient id="face-top" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF9F4D"/>
      <stop offset="100%" stop-color="#FF8C33"/>
    </linearGradient>
  </defs>
  <!-- Isometric cube -->
  <!-- Top face -->
  <polygon points="100,28 170,68 100,108 30,68" fill="url(#face-top)"/>
  <!-- Left face -->
  <polygon points="30,68 100,108 100,178 30,138" fill="url(#face-left)"/>
  <!-- Right face -->
  <polygon points="170,68 100,108 100,178 170,138" fill="url(#face-right)"/>
  <!-- Edge highlights -->
  <line x1="100" y1="28" x2="100" y2="108" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="30" y1="68" x2="100" y2="108" stroke="rgba(0,0,0,0.1)" stroke-width="0.5"/>
  <line x1="170" y1="68" x2="100" y2="108" stroke="rgba(0,0,0,0.1)" stroke-width="0.5"/>
  <!-- Inner cutout triangle (risk/void) -->
  <polygon points="100,70 130,88 100,108" fill="rgba(0,0,0,0.25)"/>
  <polygon points="100,70 70,88 100,108" fill="rgba(0,0,0,0.35)"/>
  <!-- Small shield accent on top face -->
  <polygon points="100,48 118,60 100,76 82,60" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
</svg>
